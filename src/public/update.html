<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Character</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Update Character</h1>

    <form id="update-character-form">
        <label for="name">Name:</label><input type="text" id="name" placeholder="Name" required>
        <label for="role">Role:</label><input type="text" id="role" placeholder="Role" required>
        <label for="homeworld">Homeworld:</label><input type="text" id="homeworld" placeholder="Homeworld" required>
        <button type="submit">Update Character</button>
    </form>

    <script src="public.js"></script>
</body>
</html>
