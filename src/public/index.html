<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Star Wars</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Star Wars Characters</h1>

    <form id="form">
        <button type="button" id="create" onclick="window.location.href='/create'">
            Create Character
        </button>
    </form>

    <div id="character-list"></div>

    <div id="rebel-popup" class="popup-overlay" hidden>
        <div class="popup">
            <button id="close-popup" class="popup-close" type="button">&times;</button>
            <pre id="rebel-text"></pre>
        </div>
    </div>

<script src="public.js"></script>
</body>
</html>
